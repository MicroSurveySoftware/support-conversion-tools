<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
"http://www.w3.org/TR/html4/loose.dtd">
<html lang="en">

<head>
    <title>Convert Line Coding to XYZ Coding</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="description" content="Convert files to STAR*NET format" />
    <meta name="keywords" content="convert, starnet" />
    <meta name="author" content="Jacob Wall" />
    <link rel="stylesheet" href="css/sgsm.css" />
</head>

<body>
    <div class="container">
        <p style="text-align:center; font-weight:bold;"><a class="button-2" href="http://helpdesk.microsurvey.com/index.php?/Knowledgebase/Article/View/1456">Return to the Main Page</a>
        </p>
        <form method="post" action="cgi-bin/codes2xyz.py" id="input_text">
            <fieldset>
                <h2><legend><strong>Convert Line Coding to XYZ Coding</strong></legend></h2>
                <table width="100%">
                    <tr>
                        <td style="width:275px">
                            <label for="begCode">Begin Line Code (include space if present):</label>
                            <input type="text" name="begCode" size="25">
                        </td>
                        <td>
                            <label for="begPos">Position:</label>
                            <input type="radio" name="begPos" value="lead1" checked>Leading
                            <input type="radio" name="begPos" value="trail1">Trailing
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="endCode">End Line Code (include space if present):</label>
                            <input type="text" name="endCode" size="25">
                        </td>
                        <td>
                            <label for="endPos">Position:</label>
                            <input type="radio" name="endPos" value="lead2" checked>Leading
                            <input type="radio" name="endPos" value="trail2">Trailing
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom:10px">
                            <label for="closeCode">Close Figure Code (include space if present):</label>
                            <input type="text" name="closeCode" size="25">
                        </td>
                        <td style="padding-bottom:10px">
                            <label for="closePos">Position:</label>
                            <input type="radio" name="closePos" value="lead3" checked>Leading
                            <input type="radio" name="closePos" value="trail3">Trailing
                        </td>
                    </tr>
                    <tr>
                        <td style="border-top:1px solid #ccc; border-bottom:1px solid #ccc; padding-bottom:10px">
                            <label for="delimiter">Values Delimiter:</label>
                            <select name="delimiter" form="input_text">
                                <option value="comma">Comma</option>
                                <option value="space">Space</option>
                                <option value="tab">Tab</option>
                            </select>
                        </td>
                        <td style="border-top:1px solid #ccc; border-bottom:1px solid #ccc; padding-bottom:10px">
                            <label for="codePos">Code Position:</label>
                            <select name="codePos" form="input_text">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option selected="selected" value="5">5</option>
                                <option value="6">6</option>
                            </select>Default=5 for P,N,E,Z,<strong style="color:#ff0000;">D</strong>
                        </td>
                    </tr>
                </table>
                <label for="content">Paste the contents of your ASCII Delimited file:</label>
                <textarea name="content" form="input_text"></textarea>
                <p>
                    <button class="submitbutton" type="submit" value="Submit">Submit</button>
                </p>
            </fieldset>
        </form>
    </div>
</body>

</html>
