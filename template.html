<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
"http://www.w3.org/TR/html4/loose.dtd">
<html lang="en">
  <head>
    <title>BROWSER TAB HEADING</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="description" content="DESCRIPTION" />
    <meta name="keywords" content="convert, starnet" />
    <meta name="author" content="MicroSurvey" />
    <link rel="stylesheet" href="css/sgsm.css" />
  </head>
  <body>
    <div class="container">
      <p style="text-align:center; font-weight:bold;"><a class="button-2" href="http://helpdesk.microsurvey.com/index.php?/Knowledgebase/Article/View/1456">Return to the Main Page</a></p>
      <form method="post" action="http://support.microsurvey.com/convert/cgi-bin/template.py" id="input_text">
        <fieldset>
        <h2><legend><strong>TITLE</strong></legend></h2>
        <legend>SUBTITLE</legend>


		<label for="formvalue_radio">RADIO BUTTON: </label>
		<input type="radio" name="formvalue_radio" value="RADIOOPTION1" checked> OPTION1 default state<br>
		<input type="radio" name="formvalue_radio" value="RADIOOPTION2"> OPTION2


		<label for "formvalue_text"><strong>BOLD TEXT NOTE:</strong> regular text
        <br><strong>TEXT INPUT:</strong> instructions for text input:</label>
        <input type="text" value = " " name="formvalue_text" size="75">


		<label for "formvalue_pulldown">SAMPLE PULLDOWN: </label>
        <select name="formvalue_pulldown" form="input_text">
            <option value="formvalue_pulldown_option1">option1</option>
            <option value="formvalue_pulldown_option2">option2</option>
            <option selected="selected" value="formvalue_pulldown_option3 DEFAULT">option3 DEFAULT</option>
            <option value="formvalue_pulldown_option4">option4</option>
            <option value="formvalue_pulldown_option5">option5</option>
            <option value="formvalue_pulldown_option6">option6</option>
        </select>





        <label for="content">INSTRUCTIONS:</label>
        <textarea name="content" form="input_text"></textarea>
        <p>
		<button class="submitbutton" type="submit" value="Submit">Submit</button>
		</p>
		</fieldset>
      </form>
    </div>
  </body>
</html>
