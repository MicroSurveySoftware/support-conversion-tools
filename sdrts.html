<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
"http://www.w3.org/TR/html4/loose.dtd">
<html lang="en">
  <head>
    <title>SDR to STAR*NET Converter</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="description" content="Convert files to STAR*NET format" />
    <meta name="keywords" content="convert, starnet" />
    <meta name="author" content="Jacob Wall" />
    <link rel="stylesheet" href="css/sgsm.css" />
  </head>
  <body>
    <div class="container">
      <p style="text-align:center; font-weight:bold;"><a class="button-2"  href="http://sgss.ca/converters.html">Return to the Main Page</a></p>
      <form method="post" action="cgi-bin/sdrts2sn.py" id="input_text">	  
        <fieldset>
        <h2><legend><strong>SDR to STAR*NET Converter</strong></legend></h2> 
		<label for "format">Format: </label>
		<input type="radio" name="format" value="sdr20" checked> SDR20<br>
		<input type="radio" name="format" value="sdr33"> SDR33
		<label for "type">Output Type: </label>
		<input type="radio" name="type" value="2D" checked> 2D<br>
		<input type="radio" name="type" value="3D"> 3D
        <label for="content">Paste the contents of your SDR file:</label> 
        <textarea name="content" form="input_text"></textarea> 
        <p>
		<button class="submitbutton" type="submit" value="Submit">Submit</button>
		</p>
		</fieldset>
      </form>
    </div>
  </body>
</html>
